<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto TTB · Config</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <div class="topbar-left">
      <h1 class="logo">Auto TTB <span class="version-badge">Config</span></h1>
    </div>
    <div class="topbar-right">
      <a href="/" class="btn btn-sm btn-outline">← Back to app</a>
    </div>
  </header>

  <main class="config-page">
    <div id="missing-banner" class="card config-banner hidden">
      Fill in the required settings below to start using the app.
    </div>

    <form id="config-form"></form>

    <div class="config-actions">
      <button type="button" id="btn-save-config" class="btn btn-primary">💾 Save</button>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="/static/config.js"></script>
</body>
</html>
